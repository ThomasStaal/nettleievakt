blueprint:
  name: Nettleievakt - varsel om høy timetopp
  description: Gi beskjed når prognosen har ligget på eller over varselgrensen i to minutter.
  domain: automation
  input:
    warning_entity:
      name: Nettleievakts varsel om høy timetopp
      selector:
        entity:
          filter:
            - domain: binary_sensor
              integration: nettleievakt
    notification_actions:
      name: Slik vil jeg få beskjed
      description: Standard er et varsel inne i Home Assistant. Velg en mobilvarslingshandling for push til telefonen. Malen styrer ikke utstyr.
      default:
        - action: persistent_notification.create
          data:
            title: Nettleievakt
            message: Timen ligger an til å nå varselgrensen. Sjekk prognosen i Nettleievakt og vurder om noe forbruk kan vente. Dette betyr ikke nødvendigvis dyrere nettleie denne måneden.
      selector:
        action: {}
triggers:
  - trigger: state
    entity_id: !input warning_entity
    to: "on"
    for:
      minutes: 2
actions: !input notification_actions
mode: single
