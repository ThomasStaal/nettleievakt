[project]
name = "nettleievakt"
version = "0.1.0b1"
description = "Local Norwegian grid-tariff peak monitoring for Home Assistant"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_engine.py" = ["E402"]
